[package]
name = "agw-http-host"
description = "TI-33/TI-34 bounded HTTP execution surface around the shared Rust guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "agindow-sidecar"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
worker-host = ["dep:worker", "dep:js-sys", "dep:futures-util"]
native = ["dep:axum", "dep:tokio", "dep:reqwest", "dep:futures-util"]

[lints]
workspace = true

[dependencies]
agw-guard = { path = "../guard" }
agw-node-guest = { path = "../node-guest" }
agw-audit = { path = "../audit" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
chrono = { workspace = true }
sha2 = "0.10"
subtle = "2"
futures-util = { version = "0.3", optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
base64 = "0.22.1"
url = "2"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
worker = { version = "=0.7.5", optional = true }
js-sys = { version = "0.3", optional = true }
