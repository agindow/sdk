[package]
name = "agw-stats"
description = "Tier 1 statistical detectors (PSI, cardinality growth, unit ratio)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
num-bigint = "0.4.6"
sha2 = "0.10.9"
serde = { workspace = true }
agw-inspector = { path = "../inspector" }
agw-diff = { path = "../diff" }
agw-audit = { path = "../audit" }

chrono = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }

[[bench]]
name = "field_detectors"
harness = false

[[bench]]
name = "array_sampling"
harness = false

[[bench]]
name = "unit_projection"
harness = false
