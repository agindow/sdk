[package]
name = "agw-audit"
description = "Audit artifact construction — what was sent, what changed, and why."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The generated contract types (src/lib.rs `contracts` module) need all three:
# serde derives, serde_json for free-form fields, chrono for `format: date-time`.
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "audit"
harness = false

[build-dependencies]
# build.rs generates the contract types from contracts/*.vN.json (TI-02 AC 5).
serde = { workspace = true }
serde_json = { workspace = true }
typify = "0.8"
