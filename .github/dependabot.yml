# Keep GitHub Actions and lockfiles current on the public mirror. Version bumps
# still land via the upstream export; Dependabot opens PRs here so maintainers
# can port accepted updates with attribution (see CONTRIBUTING.md).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /cells/cell-relay/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
